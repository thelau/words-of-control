<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Words of Control</title>
    <meta name="description" content="Type words. An AI judges them — 45 questions — and an authored grid of image and sound performs the judgement, then cuts to black. Nothing you see or hear is AI-generated. A work by Laurent Thevenet." />
    <meta name="author" content="Laurent Thevenet" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- social previews (public/og.png, 1200 × 630, a frame of the piece; on deploy, make og:image absolute) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Words of Control" />
    <meta property="og:title" content="Words of Control" />
    <meta property="og:description" content="Type words. An AI judges them, and a grid of image and sound performs the judgement. Nothing you see or hear is AI-generated." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Seven red panels: the answers that set the word “war” apart, each a spread of reference words and a white needle." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Words of Control" />
    <meta name="twitter:description" content="Type words. An AI judges them, and a grid of image and sound performs the judgement." />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="captions" aria-hidden="true"></div>
    <div id="stage" aria-hidden="true">
      <div id="line"><span id="text"></span><span id="cursor"></span></div>
      <div id="note" hidden></div>
    </div>
    <div id="support" hidden></div>
    <textarea id="sink" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="input"></textarea>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
